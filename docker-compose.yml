version: '3.8'

services:
  supportpilot:
    build: .
    container_name: supportpilot-service
    ports:
      - "8001:8001"
    volumes:
      - supportpilot-data:/app/backend/data
    environment:
      - PORT=8001
      - NODE_ENV=production
    restart: unless-stopped

volumes:
  supportpilot-data:
